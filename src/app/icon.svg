<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon. A simplified version of the header leaf: at 16px the side veins
    turn to mud, so only the blade and midrib survive. Sits on a cream roundel
    so it holds its shape against both light and dark browser chrome.
  -->
  <rect width="32" height="32" rx="7" fill="#f3ecdd"/>
  <path
    d="M16 5c5.4 6 10.4 11.6 10.4 16.2 0 5.2-4.6 9.2-10.4 9.8-5.8-.6-10.4-4.6-10.4-9.8C5.6 16.6 10.6 11 16 5Z"
    fill="#6e8b4a"/>
  <path d="M16 8.5v19" stroke="#f3ecdd" stroke-width="2" stroke-linecap="round"/>
</svg>
